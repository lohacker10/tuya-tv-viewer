plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'it.tuyatv.logintest'
    compileSdk 35
    defaultConfig {
        applicationId 'it.tuyatv.p2ptest'
        minSdk 24
        targetSdk 28
        versionCode 5
        versionName '0.5.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false }
}
chaquopy {
    defaultConfig {
        version = '3.12'
        pip { install 'tuya-ipc-p2p-sdk==0.1.1' }
    }
}
