plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'it.tuyatv.logintest'
    compileSdk 35
    defaultConfig {
        applicationId 'it.tuyatv.p2ptest'
        minSdk 24
        targetSdk 28
        versionCode 11
        versionName '0.11.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false }
}
chaquopy {
    defaultConfig {
        version = '3.11'
        pip { 
            // shortcut: SDK 0.1.1's AES calls work with the only Android wheel here; revisit when newer wheels appear.
            install 'cryptography==42.0.8'
            install 'aiohttp>=3.11'
            install 'aiomqtt>=2.0'
        }
    }
}
