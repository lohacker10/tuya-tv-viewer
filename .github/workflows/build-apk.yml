name: Build and publish Android TV beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-tv-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --no-pub

      - name: Test signaling and session renewal
        run: python -m unittest discover -s test -p 'test_*.py' -v

      - name: Test live MP4 fragments and audio clocks
        run: dart run test/fmp4_fragments_check.dart

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Name and checksum APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk tuya-tv-viewer-v0.11.0-beta.5.apk
          sha256sum tuya-tv-viewer-v0.11.0-beta.5.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuya-tv-viewer-v0.11.0-beta.5
          path: tuya-tv-viewer-v0.11.0-beta.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.11.0-beta.5
          ASSET: tuya-tv-viewer-v0.11.0-beta.5.apk
        run: |
          set -euo pipefail
          NOTES="Beta 5: home con sole quattro anteprime a tutto schermo, bordo di selezione, navigazione tramite telecomando. Selezionando una telecamera si richiede il flusso principale HD con audio; BACK ripristina quattro stream SD silenziosi. Supporto H.264 e H.265/MP4 del portale EU, con ripristino SD se il decoder HD non riesce a riprodurre. Login automatico username/password invariato. Richiede Android 7/API 24: Fire OS 5 non è compatibile e Vega OS non esegue questo APK. Verifica su TV reale ancora necessaria. Firma debug per prove manuali."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "Release $TAG already exists; keeping its APK unchanged."
            fi
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Tuya TV Viewer v0.11.0 beta 5 HD e audio" \
              --prerelease --notes "$NOTES"
          fi
