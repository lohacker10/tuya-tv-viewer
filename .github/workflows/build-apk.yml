name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check installed Android SDK
        run: test -d "$ANDROID_HOME"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuya-tv-p2p-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish v0.4.0 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.4.0"
          ASSET="tuya-tv-viewer-v0.4.0.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          sha256sum "$ASSET"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: leaving previous asset unchanged."
            exit 0
          fi
          gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tuya TV Viewer v0.4.0 — Test MQTT e log copiabile" \
            --prerelease \
            --notes "APK sperimentale per Android TV. Login Tuya Smart, test configurazione IPC, relay TCP e autenticazione MQTT 3.1.1 su TLS, senza inviare offer SDP o aprire video. Pulsante COPIA LOG con oscuramento nomi e identificativi. Questa build NON riproduce ancora video. Stesso applicationId della v0.2/v0.3, ma firma debug variabile: se l'aggiornamento non è accettato da Android occorre disinstallare la build precedente. Nessuna credenziale, sessione o chiave utente pubblicata."
