name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, video-experiment]
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.12 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Vendor pinned MIT Tuya P2P Python package
        run: |
          python -m pip download --no-deps --only-binary=:all: -d /tmp/tuya_pkg 'tuya-ipc-p2p-sdk==0.1.1'
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          file = next(Path('/tmp/tuya_pkg').glob('tuya_ipc_p2p_sdk-*.whl'))
          with ZipFile(file) as z:
              for name in z.namelist():
                  if name.startswith('tuya_ipc_p2p_sdk/') and not name.endswith('/'):
                      out=Path('app/src/main/python') / name
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(z.read(name))
          PY
      - name: Check Python video engine syntax
        run: python -m py_compile app/src/main/python/tuya_stream.py
      - name: Check video format parser and privacy filter
        run: |
          python -m unittest discover -s tools-tests -p 'test_video_gate.py' -v
          mkdir -p /tmp/tuya-test-classes
          javac -d /tmp/tuya-test-classes app/src/main/java/it/tuyatv/logintest/SafeDiagnostics.java tools-tests/it/tuyatv/logintest/SafeDiagnosticsTest.java
          java -cp /tmp/tuya-test-classes it.tuyatv.logintest.SafeDiagnosticsTest
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuya-tv-video-experimental
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
