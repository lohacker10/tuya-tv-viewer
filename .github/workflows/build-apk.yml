name: Build and publish Telecamere

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telecamere-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --no-pub

      - name: Test signaling and session renewal
        run: python -m unittest discover -s test -p 'test_*.py' -v

      - name: Test live MP4 fragments and audio clocks
        run: dart run test/fmp4_fragments_check.dart

      - name: Prepare production signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to sign the stable release."
            exit 1
          fi
          key_file="$RUNNER_TEMP/telecamere-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          {
            echo "ANDROID_KEYSTORE_FILE=$key_file"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Name and checksum APK
        if: steps.signing.outputs.configured == 'true'
        run: |
          version="$(awk '/^version:/ { split($2, parts, "+"); print parts[1] }' pubspec.yaml)"
          apk="Telecamere-v${version}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          printf 'RELEASE_VERSION=%s\nAPK_NAME=%s\n' "$version" "$apk" >> "$GITHUB_ENV"

      - name: Save signed APK as workflow artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Telecamere-v${{ env.RELEASE_VERSION }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump pubspec.yaml before publishing another APK."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Prima release stabile di Telecamere.

          - Home essenziale con quattro anteprime e ordine nord, nord est, est, sud ricavato dai nomi Tuya.
          - Selezione con telecomando, riproduzione a tutto schermo in HD e audio quando disponibile.
          - Controllo aggiornamenti da GitHub con verifica SHA-256; Android richiede la conferma d'installazione.
          - Compatibile con Android 7 / API 24 o superiore. Fire OS 5 e Vega OS non sono supportati.
          EOF
          gh release create "$tag" "$APK_NAME" "$APK_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Telecamere $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

