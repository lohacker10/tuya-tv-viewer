name: Build and publish Android TV beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-tv-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Name and checksum APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk tuya-tv-viewer-v0.11.0-beta.3.apk
          sha256sum tuya-tv-viewer-v0.11.0-beta.3.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuya-tv-viewer-v0.11.0-beta.3
          path: tuya-tv-viewer-v0.11.0-beta.3.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.11.0-beta.3
          ASSET: tuya-tv-viewer-v0.11.0-beta.3.apk
        run: |
          set -euo pipefail
          NOTES="Beta Flutter per Android TV e Fire TV: login Tuya, griglia live 2x2 e selezione a schermo intero. La beta 3 mostra per ogni telecamera lo stato P2P e il tipo dell’ultimo errore, così da diagnosticare i flussi senza condividere credenziali. Login email o telefono/password; Android 7+ e dispositivi ARMv7/ARM64. La diretta resta sperimentale: il protocollo indipendente è alpha, MJPEG è il percorso video implementato e H.264 non è verificato. Installazione con firma debug: per passare da un APK firmato diversamente può servire disinstallare la versione precedente."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "Release $TAG already exists; keeping its APK unchanged."
            fi
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Tuya TV Viewer v0.11.0 beta 3 Flutter" \
              --prerelease --notes "$NOTES"
          fi
