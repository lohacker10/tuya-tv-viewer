name: Publish v0.2.0 APK to Releases
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v0.2.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download existing verified APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 41306939301 --repo "$GITHUB_REPOSITORY" --name tuya-tv-login-debug-apk --dir dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/tuya-tv-p2p-test-v0.2.0.apk
          sha256sum dist/tuya-tv-p2p-test-v0.2.0.apk
      - name: Publish test APK as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.0
        run: |
          set -euo pipefail
          ASSET="dist/tuya-tv-p2p-test-v0.2.0.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Tuya TV P2P Test v0.2.0 (sperimentale)" \
              --prerelease \
              --notes "APK sperimentale per Android TV. Login Tuya Smart e test di sola lettura della disponibilita della configurazione video P2P. Non include ancora streaming o griglia 2x2. Nessuna credenziale utente o identificativo di telecamera nel repository. Inserire i dati soltanto sull'app installata. APK firmato con chiave debug della build di prova; potrebbe non aggiornare altre installazioni debug e non e destinato al Play Store."
          fi
